<!-- ==========================================================================
     HTTPS 전환 임시 조치 — 현재 사이트의 index.html 용

     [이 파일을 쓰는 이유]
     이 서버는 openresty(nginx) 라서 .htaccess 를 아예 읽지 않는다.
     서버 설정을 우리가 못 바꾸는 동안의 임시 방편이다.

     [넣는 위치]
     index.html 의 <head> 를 연 직후, 맨 첫 줄.
     늦게 넣으면 이미 http 로 파일들을 받기 시작한 뒤라 효과가 준다.

         <head>
         여기에 아래 <script> 블록을 붙여넣는다
         <meta charset="utf-8">
         ...

     [한계 — 알고 쓰자]
     · 진짜 리다이렉트(301)가 아니다. 검색엔진은 이걸 주소 이전으로 안 본다.
     · 페이지가 http 로 한 번 열린 뒤에 전환된다. 아주 짧게 http 상태가 있다.
     · 자바스크립트를 끈 브라우저에서는 동작하지 않는다.

     그래서 이건 임시다. 제대로 된 해결은 카페24가 서버에서 리다이렉트를
     걸어주거나, 정적 호스팅으로 옮기는 것이다. docs/CAFE24-HTTPS.md 참고.
     ========================================================================== -->

<script>
  (function () {
    // http 로 열렸을 때만 https 로 다시 연다.
    // replace() 를 쓰는 이유: 뒤로가기 눌렀을 때 http 로 되돌아가지 않게.
    if (location.protocol === 'http:') {
      location.replace('https://' + location.host
                       + location.pathname + location.search + location.hash);
    }
  })();
</script>
